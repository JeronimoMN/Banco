<div class="container-fluid text-center" style="margin-top: 10%; width: fit-content;">
    <div class="row align-items-center justify-content-center">
        <div class="col align-self-center">
            <div class="card">
                <div class="card-body overflow-hidden">
                    <div class="row-m-0">
                        <div class="col-sm-12 col-lg-12 col-md-12 col-xl-12 px-4 py-3">
                            <h4 class="card-title mb-2">Clave Dinamica</h4>
                            <p>Por favor, ingresa tu clave dinamica:</p>
                            <form class="form-control" style="border: none;" [formGroup]="dynamicForm"
                                (ngSubmit)="onSubmit()">
                                <div class="form-group d-flex justify-content-start mb-3">
                                    <input type="number" formControlName="dynamicKey" class="form-control"
                                        placeholder="Clave Dinamica">
                                </div>
                                <button class="btn btn-primary" type="submit" [disabled]="dynamicForm.invalid"
                                    [disabled]="dynamicForm.invalid" style="margin-right: 5px;">Ingresar</button>
                                <button class="btn btn-danger" [routerLink]="['/../client']"
                                    type="submit">Volver</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
